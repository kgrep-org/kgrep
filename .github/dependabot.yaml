version: 2
updates:
  - package-ecosystem: "gomod"
    milestone: 4
    directory: "/"
    schedule:
      interval: "daily"
    allow:
      - dependency-type: "all"
    open-pull-requests-limit: 1
  - package-ecosystem: "github-actions"
    milestone: 4
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/*"
